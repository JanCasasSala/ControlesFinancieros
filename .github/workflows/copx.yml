name: Monitor COPX

on:
  schedule:
    # Lunes a viernes — 15:30 UTC (cierre NYSE)
    - cron: '30 15 * * 1-5'
    # Lunes a viernes — 21:00 UTC (resumen fin de jornada)
    - cron: '0 21 * * 1-5'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install yfinance requests pandas matplotlib --quiet

      - name: Ejecutar monitor COPX
        run: python copx/script_entrada_copx.py

      - name: Commit output HTML y JSON
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add copx/Monitor_COPX.html # copx/hitos_historial.json
          git diff --cached --quiet || git commit -m "Monitor COPX — $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
