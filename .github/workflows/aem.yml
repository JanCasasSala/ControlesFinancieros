name: Monitor AEM

on:
  schedule:
    # Lunes a viernes — 15:30 UTC (hora de cierre NYSE)
    - cron: '30 15 * * 1-5'
    # Lunes a viernes — 21:00 UTC (resumen fin de jornada)
    - cron: '0 21 * * 1-5'
  workflow_dispatch:  # Ejecución manual desde GitHub Actions

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install yfinance requests pandas matplotlib --quiet

      - name: Ejecutar monitor AEM
        run: python aem/script_entrada_aem.py

      - name: Commit output HTML y JSON
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add aem/Monitor_AEM.html aem/hitos_historial.json || true
          git diff --cached --quiet || git commit -m "Monitor AEM — $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
